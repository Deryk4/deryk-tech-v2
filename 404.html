<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | Page Not Found — Deryk.Tech</title>

    <meta name="robots" content="noindex, follow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            background:
                radial-gradient(circle at 50% 40%, rgba(57,120,246,0.12), transparent 45%),
                var(--light);
        }

        .error-content {
            max-width: 650px;
        }

        .error-code {
            font-family: var(--font-heading);
            font-size: clamp(100px, 22vw, 190px);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -12px;
            color: var(--dark);
        }

        .error-code span {
            color: var(--blue);
        }

        .error-label {
            display: inline-block;
            margin: 25px 0 15px;
            padding: 8px 16px;
            border: 1px solid rgba(57,120,246,0.25);
            border-radius: 50px;
            color: var(--blue);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .error-content h1 {
            font-family: var(--font-heading);
            font-size: clamp(28px, 5vw, 42px);
            color: var(--dark);
            margin-bottom: 15px;
        }

        .error-content p {
            color: var(--muted);
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .error-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
        }

        .error-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s ease;
        }

        .error-button.primary {
            background: var(--blue);
            color: var(--white);
        }

        .error-button.primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(57,120,246,0.25);
        }

        .error-button.secondary {
            border: 1px solid #cbd5e1;
            color: var(--dark);
        }

        .error-button.secondary:hover {
            border-color: var(--blue);
            color: var(--blue);
        }

        .error-footer {
            margin-top: 65px;
            font-size: 13px;
            color: var(--muted);
        }

        .error-footer span {
            color: var(--blue);
        }
    </style>
</head>

<body>

    <main class="error-page">

        <div class="error-content">

            <div class="error-code">
                4<span>0</span>4
            </div>

            <span class="error-label">ERROR 404</span>

            <h1>Looks like you're lost.</h1>

            <p>
                The page you're looking for doesn't exist,
                may have moved, or is temporarily unavailable.
                Let's get you back on track.
            </p>

            <div class="error-actions">

                <a href="./" class="error-button primary">
                    Back to Homepage →
                </a>

                <a href="./#contact" class="error-button secondary">
                    Contact Us
                </a>

            </div>

            <div class="error-footer">
                © 2026 <span>Deryk.Tech</span> · Build. Create. Digitalize.
            </div>

        </div>

    </main>

</body>
</html>
